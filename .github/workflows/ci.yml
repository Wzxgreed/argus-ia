name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Check formatting (Black)
        run: black --check --diff scripts/ tests/

      - name: Check linting (Ruff)
        run: ruff check scripts/ tests/

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov responses jsonschema

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short \
            -m "not integration and not slow" \
            --cov=scripts --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  validate-schema:
    name: Validate JSON Schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Validate schema file
        run: |
          python -c "
          import json
          import jsonschema
          with open('data/latest.schema.json') as f:
              schema = json.load(f)
          jsonschema.Draft7Validator.check_schema(schema)
          print('Schema is valid')
          "

      - name: Check schema examples
        run: |
          python -c "
          import json
          import jsonschema
          from pathlib import Path
          with open('data/latest.schema.json') as f:
              schema = json.load(f)
          # Crée un snapshot minimal pour tester le schema
          example = {
              'meta': {
                  'date': '2026-05-16',
                  'source': 'yfinance',
                  'fetched_at': '2026-05-16T08:30:00+00:00',
                  'tickers_requested': ['AAPL'],
                  'tickers_ok': 1,
                  'tickers_ko': 0,
              },
              'prices': {
                  'AAPL': {
                      'ticker': 'AAPL',
                      'error': False,
                      'price': {'open': 190, 'high': 192, 'low': 189, 'close': 191, 'previous_close': 190, 'volume': 1000, 'volume_avg_20d': 1000, 'change_pct': 0.5},
                      'technical': {'rsi14': 50, 'atr14': 2, 'mm50': 190, 'mm200': 185, 'golden_cross': True},
                      'fundamentals': {'market_cap': 1000, 'sector': 'Tech'},
                      'options': {},
                      'timestamp': '2026-05-16T08:30:00+00:00',
                  }
              }
          }
          jsonschema.validate(instance=example, schema=schema)
          print('Example snapshot validates against schema')
          "
